<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TastyBite | سلة المشتريات</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0b0d0e;
            color: white;
            min-height: 100vh;
        }

        /* ===== Navbar ===== */

        nav {
            height: 70px;
            background: #111415;
            border-bottom: 1px solid #292d2e;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ff7a00;
        }

        .logo span {
            color: white;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            color: #ddd;
            text-decoration: none;
            transition: .3s;
        }

        .nav-links a:hover,
        .nav-links .active {
            color: #ff7a00;
        }

        .cart-button {
            background: #ff7a00;
            color: white;
            text-decoration: none;

            padding: 10px 16px;
            border-radius: 9px;
        }


        /* ===== Page ===== */

        .page {
            width: 86%;
            max-width: 1200px;
            margin: auto;

            padding: 60px 0;
        }

        .title {
            text-align: center;
            margin-bottom: 45px;
        }

        .title h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .title h1 span {
            color: #ff7a00;
        }

        .title p {
            color: #999;
        }


        /* ===== Layout ===== */

        .cart-layout {
            display: grid;
            grid-template-columns: 1fr 330px;
            gap: 25px;
            align-items: start;
        }


        /* ===== Cart Items ===== */

        .cart-items {
            background: #111415;
            border: 1px solid #292d2e;
            border-radius: 15px;
            overflow: hidden;
        }

        .cart-header {
            padding: 20px;
            border-bottom: 1px solid #292d2e;

            display: flex;
            justify-content: space-between;
        }

        .cart-header h2 {
            font-size: 20px;
        }

        .cart-header span {
            color: #999;
        }


        .item {
            display: grid;
            grid-template-columns: 90px 1fr auto;
            gap: 18px;

            align-items: center;

            padding: 20px;

            border-bottom: 1px solid #292d2e;
        }

        .item:last-child {
            border-bottom: none;
        }

        .item img {
            width: 90px;
            height: 75px;

            object-fit: cover;

            border-radius: 10px;
        }

        .item-info h3 {
            margin-bottom: 7px;
        }

        .item-info p {
            color: #ff7a00;
            font-weight: bold;
        }


        /* ===== Quantity ===== */

        .quantity {
            display: flex;
            align-items: center;
            gap: 8px;

            margin-top: 10px;
        }

        .quantity button {
            width: 28px;
            height: 28px;

            border: none;
            border-radius: 6px;

            background: #292d2e;
            color: white;

            cursor: pointer;
            font-size: 17px;
        }

        .quantity button:hover {
            background: #ff7a00;
        }

        .quantity span {
            min-width: 20px;
            text-align: center;
        }


        .item-total {
            text-align: left;
        }

        .item-total strong {
            color: #ff7a00;
            font-size: 18px;
        }

        .remove {
            display: block;

            margin-top: 10px;

            border: none;
            background: none;

            color: #777;
            cursor: pointer;
        }

        .remove:hover {
            color: #ff4b4b;
        }


        /* ===== Summary ===== */

        .summary {
            background: #111415;
            border: 1px solid #292d2e;

            border-radius: 15px;

            padding: 25px;

            position: sticky;
            top: 95px;
        }

        .summary h2 {
            margin-bottom: 25px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;

            margin-bottom: 18px;

            color: #bbb;
        }

        .summary-row.total {
            border-top: 1px solid #292d2e;

            padding-top: 20px;

            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .summary-row.total strong {
            color: #ff7a00;
        }

        .checkout {
            display: block;

            width: 100%;

            background: #ff7a00;
            color: white;

            text-align: center;
            text-decoration: none;

            padding: 14px;

            border-radius: 9px;

            margin-top: 25px;

            transition: .3s;
        }

        .checkout:hover {
            background: #ff8c1a;
            transform: translateY(-2px);
        }


        /* ===== Empty Cart ===== */

        .empty {
            text-align: center;
            padding: 70px 20px;
        }

        .empty-icon {
            font-size: 55px;
            margin-bottom: 20px;
        }

        .empty h2 {
            margin-bottom: 10px;
        }

        .empty p {
            color: #888;
            margin-bottom: 25px;
        }

        .shop-btn {
            display: inline-block;

            background: #ff7a00;
            color: white;

            text-decoration: none;

            padding: 13px 25px;
            border-radius: 9px;
        }


        /* ===== Footer ===== */

        footer {
            margin-top: 50px;

            padding: 30px 7%;

            background: #111415;

            text-align: center;

            color: #777;

            border-top: 1px solid #292d2e;
        }

        footer strong {
            color: #ff7a00;
        }


        /* ===== Mobile ===== */

        @media (max-width: 800px) {

            .nav-links {
                display: none;
            }

            .cart-layout {
                grid-template-columns: 1fr;
            }

            .summary {
                position: static;
            }

        }


        @media (max-width: 500px) {

            nav {
                padding: 0 5%;
            }

            .page {
                width: 92%;
                padding-top: 40px;
            }

            .title h1 {
                font-size: 30px;
            }

            .item {
                grid-template-columns: 70px 1fr;
            }

            .item img {
                width: 70px;
                height: 65px;
            }

            .item-total {
                grid-column: 2;
                text-align: right;
            }

        }

    </style>
</head>


<body>


    <!-- Navigation -->

    <nav>

        <div class="logo">
            🍴 <span>Tasty</span>Bite
        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html">
                    الرئيسية
                </a>
            </li>

            <li>
                <a href="menu.html">
                    القائمة
                </a>
            </li>

            <li>
                <a href="cart.html" class="active">
                    السلة
                </a>
            </li>

        </ul>

        <a href="cart.html" class="cart-button">
            🛒 السلة
        </a>

    </nav>


    <!-- Page -->

    <main class="page">


        <div class="title">

            <h1>
                سلة <span>المشتريات</span>
            </h1>

            <p>
                راجع طلبك قبل إتمام عملية الشراء
            </p>

        </div>


        <div id="cartContent"></div>


    </main>


    <!-- Footer -->

    <footer>

        <strong>TastyBite</strong>

        <p>
            © 2026 جميع الحقوق محفوظة
        </p>

    </footer>


  <script>

    let cart =
        JSON.parse(localStorage.getItem("cart")) || [];


    /* ================= صور المنتجات ================= */

    function getImage(name) {

        const images = {

            /* الوجبات */

            "برغر كلاسيك": "images/1/burger.jpg",

            "بيتزا بيبروني": "images/1/pizza.jpg",

            "بطاطس مقلية": "images/1/fries.jpg",

            "دجاج مقرمش": "images/1/chicken.jpg",

            "باستا كريمية": "images/1/pasta.jpg",

            "برغر الدجاج": "images/1/chicken-burger.jpg",

            "تاكوس الدجاج": "images/1/tacos.jpg",

            "أجنحة الدجاج": "images/1/wings.jpg",

            "هوت دوغ": "images/1/hotdog.jpg",

            "دجاج مقلي": "images/1/fried-chicken.jpg",


            /* الحلويات */

            "تشيز كيك": "images/2/cheesecake.jpg",

            "براوني شوكولاتة": "images/2/brownie.jpg",

            "بان كيك": "images/2/pancakes.jpg",

            "كيك الشوكولاتة": "images/2/chocolate-cake.jpg",

            "دونات شوكولاتة": "images/2/donut.jpg",

            "آيس كريم": "images/2/ice-cream.jpg",

            "وافل": "images/2/waffle.jpg",

            "تيراميسو": "images/2/tiramisu.jpg",

            "كريب شوكولاتة": "images/2/crepe.jpg",

            "كوكيز الشوكولاتة": "images/2/cookies.jpg"

        };

        return images[name] || "images/1/drink.jpg";
    }


    /* ================= تجميع المنتجات ================= */

    function groupCart() {

        let grouped = {};

        cart.forEach(item => {

            if (!grouped[item.name]) {

                grouped[item.name] = {

                    name: item.name,

                    price: item.price,

                    quantity: 0

                };

            }

            grouped[item.name].quantity++;

        });

        return Object.values(grouped);
    }


    /* ================= عرض السلة ================= */

    function renderCart() {

        let container =
            document.getElementById("cartContent");

        let products = groupCart();


        /* السلة فارغة */

        if (products.length === 0) {

            container.innerHTML = `

                <div class="cart-items">

                    <div class="empty">

                        <div class="empty-icon">
                            🛒
                        </div>

                        <h2>
                            السلة فارغة
                        </h2>

                        <p>
                            لم تضف أي وجبة إلى السلة بعد.
                        </p>

                        <a
                            href="menu.html"
                            class="shop-btn">

                            تصفح القائمة

                        </a>

                    </div>

                </div>

            `;

            return;
        }


        let subtotal = 0;

        let itemsHTML = "";


        products.forEach((item, index) => {

            let itemTotal =
                item.price * item.quantity;

            subtotal += itemTotal;


            itemsHTML += `

                <div class="item">

                    <img
                        src="${getImage(item.name)}"
                        alt="${item.name}"
                    >

                    <div class="item-info">

                        <h3>
                            ${item.name}
                        </h3>

                        <p>
                            ${item.price} DH
                        </p>

                        <div class="quantity">

                            <button
                                onclick="decrease(${index})">
                                −
                            </button>

                            <span>
                                ${item.quantity}
                            </span>

                            <button
                                onclick="increase(${index})">
                                +
                            </button>

                        </div>

                    </div>


                    <div class="item-total">

                        <strong>
                            ${itemTotal} DH
                        </strong>

                        <button
                            class="remove"
                            onclick="removeItem(${index})">

                            حذف

                        </button>

                    </div>

                </div>

            `;

        });


        /* التوصيل */

        let delivery = 10;

        let total = subtotal + delivery;


        container.innerHTML = `

            <div class="cart-layout">


                <div class="cart-items">

                    <div class="cart-header">

                        <h2>
                            المنتجات
                        </h2>

                        <span>
                            ${cart.length} قطعة
                        </span>

                    </div>

                    ${itemsHTML}

                </div>


                <div class="summary">

                    <h2>
                        ملخص الطلب
                    </h2>


                    <div class="summary-row">

                        <span>
                            مجموع المنتجات
                        </span>

                        <span>
                            ${subtotal} DH
                        </span>

                    </div>


                    <div class="summary-row">

                        <span>
                            التوصيل
                        </span>

                        <span>
                            ${delivery} DH
                        </span>

                    </div>


                    <div class="summary-row total">

                        <span>
                            الإجمالي
                        </span>

                        <strong>
                            ${total} DH
                        </strong>

                    </div>


                    <a
                        href="checkout.html"
                        class="checkout">

                        إتمام الطلب →

                    </a>

                </div>


            </div>

        `;

    }


    /* ================= زيادة الكمية ================= */

    function increase(index) {

        let products = groupCart();

        let product = products[index];


        cart.push({

            name: product.name,

            price: product.price

        });


        saveCart();

    }


    /* ================= تقليل الكمية ================= */

    function decrease(index) {

        let products = groupCart();

        let product = products[index];


        let position = cart.findIndex(

            item =>
                item.name === product.name

        );


        if (position !== -1) {

            cart.splice(position, 1);

        }


        saveCart();

    }


    /* ================= حذف المنتج ================= */

    function removeItem(index) {

        let products = groupCart();

        let product = products[index];


        cart = cart.filter(

            item =>
                item.name !== product.name

        );


        saveCart();

    }


    /* ================= حفظ السلة ================= */

    function saveCart() {

        localStorage.setItem(

            "cart",

            JSON.stringify(cart)

        );


        renderCart();

    }


    /* ================= تشغيل الصفحة ================= */

    renderCart();

</script>

</body>

</html>
